<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="450" height="180">
  <defs>
    <linearGradient id="s2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424"/>
      <stop offset="50%" stop-color="#122542"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="s2_orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="s2_purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="s2_gemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ea8e7"/>
      <stop offset="50%" stop-color="#8a4bf3"/>
      <stop offset="100%" stop-color="#e847ae"/>
    </linearGradient>
  </defs>

  <!-- Background Capsule -->
  <rect width="500" height="200" rx="100" fill="url(#s2_bg)"/>
  <rect width="496" height="196" x="2" y="2" rx="98" fill="none" stroke="url(#s2_orange)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- RAG Embeddings Matrix Network -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4">
    <line x1="60" y1="100" x2="130" y2="50"/>
    <line x1="60" y1="100" x2="130" y2="150"/>
    <line x1="130" y1="50" x2="210" y2="80"/>
    <line x1="130" y1="150" x2="210" y2="120"/>
    <line x1="210" y1="80" x2="290" y2="50"/>
    <line x1="210" y1="120" x2="290" y2="150"/>
    <line x1="290" y1="50" x2="360" y2="100"/>
    <line x1="290" y1="150" x2="360" y2="100"/>
    <line x1="210" y1="80" x2="210" y2="120"/>
  </g>

  <!-- Framework Nodes -->
  <!-- Node 1: TensorFlow Orange Cube -->
  <g transform="translate(60, 100)">
    <circle r="22" fill="url(#s2_orange)"/>
    <text y="5" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TF</text>
  </g>

  <!-- Node 2: Keras Red -->
  <g transform="translate(130, 50)">
    <circle r="20" fill="#dc2626"/>
    <text y="5" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Keras</text>
  </g>

  <!-- Node 3: RAG Core (Center) -->
  <g transform="translate(210, 100)">
    <rect x="-35" y="-22" width="70" height="44" rx="10" fill="url(#s2_purple)"/>
    <text y="-3" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RAG</text>
    <text y="12" fill="#e9d5ff" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">&amp; LLMs</text>
  </g>

  <!-- Node 4: MNE-Python -->
  <g transform="translate(290, 150)">
    <circle r="20" fill="#0284c7"/>
    <text y="4" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MNE</text>
  </g>

  <!-- Node 5: Gemini API Spark (Right Node) -->
  <g transform="translate(360, 100)">
    <circle r="26" fill="url(#s2_gemini)"/>
    <text y="5" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">✨</text>
  </g>

  <!-- Frameworks Card Right -->
  <rect x="405" y="55" width="70" height="90" rx="14" fill="#0f1c30" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="440" y="85" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="18" text-anchor="middle">⚡</text>
  <text x="440" y="108" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GEMINI</text>
  <text x="440" y="125" fill="#ff9900" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">API</text>
</svg>
