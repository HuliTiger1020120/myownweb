<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#1a2b4a"/>
    </linearGradient>
    <linearGradient id="sihGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="16" fill="url(#bg4)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- App Window Container -->
  <rect x="60" y="40" width="1080" height="595" rx="14" fill="#0d1829" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" filter="url(#shadow4)"/>

  <!-- Header -->
  <path d="M 60 54 A 14 14 0 0 1 74 40 L 1126 40 A 14 14 0 0 1 1140 54 L 1140 90 L 60 90 Z" fill="#15243b"/>
  <circle cx="90" cy="65" r="6" fill="#ef4444"/>
  <circle cx="110" cy="65" r="6" fill="#f59e0b"/>
  <circle cx="130" cy="65" r="6" fill="#10b981"/>

  <text x="160" y="70" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">🛡️ ARTINAAI — AI GRIEVANCE MANAGEMENT PLATFORM (SIH 2026)</text>
  <rect x="920" y="52" width="190" height="26" rx="13" fill="url(#sihGrad)"/>
  <text x="940" y="69" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">SMART INDIA HACKATHON</text>

  <!-- Top Metric Cards -->
  <rect x="100" y="110" width="240" height="90" rx="10" fill="#162a45" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="120" y="138" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Total Grievances Processed</text>
  <text x="120" y="172" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">12,480</text>
  <text x="240" y="172" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="12">98.4% Auto AI</text>

  <rect x="360" y="110" width="240" height="90" rx="10" fill="#162a45" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="380" y="138" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Critical Priority Complaints</text>
  <text x="380" y="172" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">142</text>
  <text x="460" y="172" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="12">Action Required</text>

  <rect x="620" y="110" width="240" height="90" rx="10" fill="#162a45" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="640" y="138" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Avg Resolution Time</text>
  <text x="640" y="172" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">4.2 Hours</text>
  <text x="770" y="172" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="12">-65% Faster</text>

  <rect x="880" y="110" width="220" height="90" rx="10" fill="#162a45" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="900" y="138" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">NLP Accuracy</text>
  <text x="900" y="172" fill="#a78bfa" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">96.7%</text>

  <!-- Left: Realtime Automated Grievance Classifier Stream -->
  <rect x="100" y="220" width="600" height="390" rx="10" fill="#13233a" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="125" y="255" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">🤖 Automated Complaint Classification Stream</text>

  <!-- Ticket 1 -->
  <rect x="125" y="275" width="550" height="90" rx="8" fill="#1c304d" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="145" y="300" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Ticket #8492: Water Pipeline Leakage &amp; Road Blockage</text>
  <text x="145" y="322" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Categorized as: <tspan fill="#60a5fa" font-weight="bold">Public Works</tspan> | Sentiment: <tspan fill="#f87171" font-weight="bold">High Frustration</tspan></text>
  <rect x="145" y="335" width="90" height="20" rx="4" fill="#ef4444"/>
  <text x="160" y="349" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">HIGH URGENCY</text>

  <!-- Ticket 2 -->
  <rect x="125" y="380" width="550" height="90" rx="8" fill="#1c304d" stroke="#3b82f6" stroke-opacity="0.3"/>
  <text x="145" y="405" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Ticket #8493: Streetlight Non-Functional on Ward 12</text>
  <text x="145" y="427" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Categorized as: <tspan fill="#60a5fa" font-weight="bold">Electrical &amp; Lighting</tspan> | Department: <tspan fill="#fbbf24" font-weight="bold">Municipal Corp</tspan></text>
  <rect x="145" y="440" width="100" height="20" rx="4" fill="#3b82f6"/>
  <text x="158" y="454" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">MEDIUM URGENCY</text>

  <!-- Ticket 3 -->
  <rect x="125" y="485" width="550" height="90" rx="8" fill="#1c304d" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="145" y="510" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Ticket #8494: Garbage Collection Delay Request</text>
  <text x="145" y="532" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Categorized as: <tspan fill="#60a5fa" font-weight="bold">Sanitation</tspan> | Department: <tspan fill="#34d399" font-weight="bold">Clean City</tspan></text>
  <rect x="145" y="545" width="90" height="20" rx="4" fill="#10b981"/>
  <text x="160" y="559" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">LOW URGENCY</text>

  <!-- Right: Category Distribution Analytics Bar Chart -->
  <rect x="720" y="220" width="380" height="390" rx="10" fill="#13233a" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="745" y="255" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">📊 Departmental AI Routing</text>

  <text x="745" y="295" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Public Works &amp; Roads (42%)</text>
  <rect x="745" y="305" width="330" height="14" rx="7" fill="#1e293b"/>
  <rect x="745" y="305" width="240" height="14" rx="7" fill="url(#sihGrad)"/>

  <text x="745" y="345" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Sanitation &amp; Waste Management (28%)</text>
  <rect x="745" y="355" width="330" height="14" rx="7" fill="#1e293b"/>
  <rect x="745" y="355" width="180" height="14" rx="7" fill="url(#blueGrad)"/>

  <text x="745" y="395" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Electrical &amp; Utilities (18%)</text>
  <rect x="745" y="405" width="330" height="14" rx="7" fill="#1e293b"/>
  <rect x="745" y="405" width="120" height="14" rx="7" fill="#10b981"/>

  <text x="745" y="445" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Other Civic Concerns (12%)</text>
  <rect x="745" y="455" width="330" height="14" rx="7" fill="#1e293b"/>
  <rect x="745" y="455" width="80" height="14" rx="7" fill="#8b5cf6"/>

  <rect x="745" y="505" width="330" height="85" rx="8" fill="#162a45"/>
  <text x="760" y="530" fill="#a78bfa" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">🏆 SIH 2026 Innovation Highlights:</text>
  <text x="760" y="550" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">• Multi-lingual BERT &amp; RoBERTa NLP models</text>
  <text x="760" y="570" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">• Automated escalation matrix for unresolved issues</text>
</svg>
