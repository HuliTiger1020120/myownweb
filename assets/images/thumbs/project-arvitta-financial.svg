<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#003554"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="16" fill="url(#bg2)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- App Window Container -->
  <rect x="60" y="40" width="1080" height="595" rx="14" fill="#09141f" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" filter="url(#shadow2)"/>

  <!-- App Header -->
  <path d="M 60 54 A 14 14 0 0 1 74 40 L 1126 40 A 14 14 0 0 1 1140 54 L 1140 90 L 60 90 Z" fill="#0f2133"/>
  <circle cx="90" cy="65" r="6" fill="#ef4444"/>
  <circle cx="110" cy="65" r="6" fill="#f59e0b"/>
  <circle cx="130" cy="65" r="6" fill="#10b981"/>

  <text x="160" y="70" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">📈 ARVITTA FINANCIAL PLATFORM</text>
  <rect x="940" y="52" width="170" height="26" rx="13" fill="url(#geminiGrad)"/>
  <text x="960" y="69" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">✨ GEMINI AI POWERED</text>

  <!-- Sidebar Navigation -->
  <rect x="60" y="90" width="220" height="545" fill="#0c1a29" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="80" y="115" width="180" height="35" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="100" y="138" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">📊 Overview & Analytics</text>
  
  <text x="100" y="185" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">💳 Transactions</text>
  <text x="100" y="225" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">🎯 Savings Goals</text>
  <text x="100" y="265" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">🤖 AI Advisor Chat</text>
  <text x="100" y="305" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">⚙️ Settings</text>

  <!-- Left Stats & Charts Area -->
  <rect x="300" y="110" width="500" height="110" rx="10" fill="#0f2336" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="320" y="140" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Total Balance</text>
  <text x="320" y="175" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="28" font-weight="bold">$48,250.00</text>
  <text x="490" y="175" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">▲ +14.2% this month</text>

  <!-- Finance Trend Chart -->
  <rect x="300" y="240" width="500" height="375" rx="10" fill="#0f2336" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="320" y="270" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Income vs Spending Analytics</text>

  <!-- Chart Curve & Gradient -->
  <path d="M 330 550 Q 400 480 470 510 T 610 370 T 770 330 L 770 570 L 330 570 Z" fill="url(#chartGrad)"/>
  <path d="M 330 550 Q 400 480 470 510 T 610 370 T 770 330" fill="none" stroke="#10b981" stroke-width="3.5"/>
  <circle cx="770" cy="330" r="6" fill="#34d399" stroke="#ffffff" stroke-width="2"/>

  <!-- Right AI Chatbot Panel -->
  <rect x="820" y="110" width="300" height="505" rx="10" fill="#0d1f30" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="820" y="110" width="300" height="50" fill="#132a40" rx="10"/>
  <text x="840" y="140" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">🤖 Gemini AI Finance Assistant</text>

  <!-- Chat Messages -->
  <rect x="835" y="180" width="220" height="60" rx="8" fill="#183652"/>
  <text x="850" y="202" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">"How much can I invest in</text>
  <text x="850" y="222" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">mutual funds this month?"</text>

  <rect x="865" y="255" width="245" height="110" rx="8" fill="#0b2b48" stroke="#3b82f6" stroke-opacity="0.4"/>
  <text x="880" y="278" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">✨ Gemini AI Insight:</text>
  <text x="880" y="298" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Based on your recurring expenses,</text>
  <text x="880" y="316" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">you can safely allocate <tspan fill="#34d399" font-weight="bold">$1,200</tspan></text>
  <text x="880" y="334" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">while keeping a 20% safety margin.</text>

  <!-- Input Field -->
  <rect x="835" y="555" width="270" height="40" rx="20" fill="#152d45" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="855" y="580" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">Ask Gemini finance questions...</text>
</svg>
