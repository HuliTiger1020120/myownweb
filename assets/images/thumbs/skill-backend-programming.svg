<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="450" height="180">
  <defs>
    <linearGradient id="s4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1712"/>
      <stop offset="50%" stop-color="#142b20"/>
      <stop offset="100%" stop-color="#1b4530"/>
    </linearGradient>
    <linearGradient id="python_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="fastapi_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Capsule -->
  <rect width="500" height="200" rx="100" fill="url(#s4_bg)"/>
  <rect width="496" height="196" x="2" y="2" rx="98" fill="none" stroke="url(#fastapi_grad)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Server Cylinders / Databases (Left Side) -->
  <g transform="translate(100, 60)">
    <!-- Top Cylinder -->
    <ellipse cx="40" cy="15" rx="35" ry="10" fill="#336791"/>
    <path d="M 5 15 L 5 40 A 35 10 0 0 0 75 40 L 75 15 Z" fill="#2b5578"/>
    <ellipse cx="40" cy="40" rx="35" ry="10" fill="#336791"/>
    
    <!-- Middle Cylinder -->
    <path d="M 5 40 L 5 65 A 35 10 0 0 0 75 65 L 75 40 Z" fill="#234562"/>
    <ellipse cx="40" cy="65" rx="35" ry="10" fill="#2b5578"/>

    <!-- Bottom Cylinder -->
    <path d="M 5 65 L 5 90 A 35 10 0 0 0 75 90 L 75 65 Z" fill="#1b364d"/>
    <ellipse cx="40" cy="90" rx="35" ry="10" fill="#234562"/>
    <text x="40" y="55" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Code Language Badges (Center) -->
  <g transform="translate(200, 45)">
    <!-- Python Badge -->
    <rect x="0" y="0" width="100" height="32" rx="8" fill="#1e293b" stroke="#ffd43b" stroke-width="1.2"/>
    <text x="50" y="20" fill="#ffd43b" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🐍 Python</text>

    <!-- FastAPI Lightning -->
    <rect x="0" y="42" width="100" height="32" rx="8" fill="url(#fastapi_grad)"/>
    <text x="50" y="62" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚡ FastAPI</text>

    <!-- C++ / Java -->
    <rect x="0" y="84" width="100" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="50" y="104" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">C++ &amp; Java</text>
  </g>

  <!-- Git/GitHub Branching Nodes (Right-Center) -->
  <g transform="translate(330, 60)" stroke="#10b981" stroke-width="2">
    <line x1="20" y1="10" x2="20" y2="80"/>
    <path d="M 20 45 Q 45 45 45 25" fill="none"/>
    <circle cx="20" cy="10" r="6" fill="#10b981"/>
    <circle cx="20" cy="45" r="6" fill="#10b981"/>
    <circle cx="20" cy="80" r="6" fill="#10b981"/>
    <circle cx="45" cy="25" r="6" fill="#34d399"/>
  </g>
  <text x="350" y="155" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Git / GitHub</text>

  <!-- Backend Core Badge Right -->
  <rect x="405" y="55" width="70" height="90" rx="14" fill="#0b1f17" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="85" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="20" text-anchor="middle">⚙️</text>
  <text x="440" y="108" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BACKEND</text>
  <text x="440" y="125" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FASTAPI</text>
</svg>
